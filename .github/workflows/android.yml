name: Exmera Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test
        run: gradle --no-daemon test assembleDebug

  exm-ingestion:
    name: EXM ONNX ingestion (python compiler + cross-language contract)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install onnx
        run: pip install onnx numpy
      - name: Run ingestion test suite
        run: python3 tools/tests/test_onnx_to_exm.py
      - name: Rebuild fixture container and pin its digest
        run: |
          python3 tools/onnx_to_exm.py ingest models/artifacts/super-resolution-10.onnx /tmp/fixture.exm \
            --id pipeline/super-resolution-10 --name "Super Resolution (sub-pixel CNN 2016)" --license MIT
          SHA=$(python3 -c "import hashlib;print(hashlib.sha256(open('/tmp/fixture.exm','rb').read()).hexdigest())")
          echo "rebuilt fixture sha256: $SHA"
          python3 tools/onnx_to_exm.py verify /tmp/fixture.exm --source models/artifacts/super-resolution-10.onnx
